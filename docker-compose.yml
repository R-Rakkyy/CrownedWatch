services:
  app:
    build: .
    restart: unless-stopped
    environment:
      CROWNED_HTTPS: ${CROWNED_HTTPS:-}
    volumes:
      - ./data:/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["${HTTP_PORT:-80}:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
volumes:
  caddy:
